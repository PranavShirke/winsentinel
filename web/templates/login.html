<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WinSentinel Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="login-title">WinSentinel</h1>
        <p class="login-subtitle">Windows Security Audit & Risk Dashboard</p>
      </div>

      <!-- Flash messages (Errors, lockout notifications) -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-messages">
            {% for category, message in messages %}
              <div class="alert-flash alert-flash-{{ category }}">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label for="username">Administrator Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            value="admin"
            required
            autocomplete="username"
            {% if locked or disabled %}disabled{% endif %}
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            required
            autocomplete="current-password"
            {% if locked or disabled %}disabled{% endif %}
          >
        </div>

        <button
          type="submit"
          class="btn btn-primary btn-block"
          {% if locked or disabled %}disabled{% endif %}
        >
          Sign In
        </button>
      </form>

      <div class="login-footer">
        Bound strictly to 127.0.0.1. Localhost access only.
      </div>
    </div>
  </div>
</body>
</html>
